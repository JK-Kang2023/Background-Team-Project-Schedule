<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAT BG Team — Gantt Chart 2026</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--bg:#0f1117;--surface:#181b24;--surface2:#1e2230;--border:#2a2f3e;--text:#e2e6f0;--muted:#7a8099;--accent:#4f8ef7;--row-h:28px;--label-w:500px;--header-h:64px;--title-w:240px;--assignee-w:72px;--prog-w:110px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;flex-shrink:0}
header h1{font-size:15px;font-weight:700;color:#fff}
header small{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:5px;font-size:11px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{background:var(--border)}.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 20px;display:flex;gap:16px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:2px}
.gantt-wrap{display:flex;flex:1;overflow:hidden}
.label-panel{width:var(--label-w);flex-shrink:0;display:flex;flex-direction:column;border-right:2px solid var(--border);background:var(--surface);z-index:20}
.label-header{height:var(--header-h);border-bottom:2px solid var(--border);display:flex;align-items:center;padding:0 0 0 8px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;gap:4px}
.lh-title{width:var(--title-w);padding-left:29px}
.lh-assignee{width:var(--assignee-w);flex-shrink:0;border-left:1px solid var(--border);padding-left:6px}
.lh-prog{width:var(--prog-w);flex-shrink:0;border-left:1px solid var(--border);padding-left:6px}
.label-body{overflow-y:auto;overflow-x:hidden;flex:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.label-body::-webkit-scrollbar{width:0}
.label-row{height:var(--row-h);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--border);transition:.12s;gap:4px;min-width:0}
.label-row:hover{background:var(--surface2)}
.label-row.epic-row{background:rgba(124,58,237,.08)}
.label-row.epic-row .row-title{font-weight:600;color:#a78bfa}
.label-row.sub-row .row-title{color:#67e8f9}
.label-row.clickable{cursor:pointer}
.row-indent{flex-shrink:0}
.row-toggle{font-size:9px;color:var(--muted);flex-shrink:0;width:12px;text-align:center}
.row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:var(--title-w);flex-shrink:0;font-size:11px}
.type-pip{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.row-assignee{width:var(--assignee-w);flex-shrink:0;display:flex;align-items:center;gap:4px;overflow:hidden;border-left:1px solid var(--border);padding-left:6px}
.av{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}
.av-name{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-prog{width:var(--prog-w);flex-shrink:0;display:flex;align-items:center;gap:5px;border-left:1px solid var(--border);padding-left:6px}
.row-prog .pn{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);width:28px;flex-shrink:0;text-align:right}
.row-prog .pb{flex:1;min-width:0;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;position:relative}
.row-prog .pb-fill{position:absolute;top:0;left:0;height:6px;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .3s ease}
.chart-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chart-header{height:var(--header-h);border-bottom:2px solid var(--border);overflow-x:scroll;overflow-y:hidden;flex-shrink:0;background:var(--surface);scrollbar-width:none;position:relative}
.chart-header::-webkit-scrollbar{display:none}
.chart-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.chart-body::-webkit-scrollbar{height:8px;width:8px}
.chart-body::-webkit-scrollbar-track{background:var(--surface)}
.chart-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.time-axis{position:absolute;top:0;left:0;height:100%;pointer-events:none}
.tc-upper{position:absolute;top:0;height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted);border-right:1px solid var(--border);letter-spacing:.3px}
.tc-lower{position:absolute;top:22px;height:42px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);border-right:1px solid rgba(255,255,255,.06);white-space:nowrap}
.tc-lower.today-d,.tc-lower.today-w,.tc-lower.today-m{color:#facc15;font-weight:700}
.today-pin{position:absolute;top:0;width:2px;background:#facc15;z-index:6;pointer-events:none;height:100%}
.today-pin::before{content:'TODAY';position:absolute;top:2px;left:3px;font-size:8px;font-weight:700;color:#facc15;letter-spacing:.5px;white-space:nowrap}
.grid-line{position:absolute;top:0;bottom:0;pointer-events:none}
.grid-line.quarter{border-left:1px solid rgba(255,255,255,.08)}
.grid-line.month{border-left:1px solid rgba(255,255,255,.04)}
.grid-line.week{border-left:1px solid rgba(255,255,255,.04)}
.grid-line.week-month{border-left:1px solid rgba(255,255,255,.1)}
.grid-line.day{border-left:1px solid rgba(255,255,255,.03)}
.grid-line.day-month{border-left:1px solid rgba(255,255,255,.08)}
.grid-line.today{border-left:2px solid #facc15;z-index:5}
.bar{position:absolute;border-radius:4px;cursor:pointer;transition:filter .15s,transform .15s;display:flex;align-items:center;overflow:hidden}
.bar:hover{filter:brightness(1.3);transform:scaleY(1.08)}
.bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;background:rgba(255,255,255,.3)}
.bar-label{position:absolute;left:6px;right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:500;z-index:2;pointer-events:none}
.bar.done{background:#22c55e;color:#052e16}.bar.final{background:#16a34a;color:#052e16}
.bar.wip{background:#f59e0b;color:#451a03}.bar.backlog{background:#4a5568;color:#e2e8f0}.bar.review{background:#7c3aed;color:#f5f3ff}
#tt{position:fixed;background:#1e2230;border:1px solid #3a4055;border-radius:8px;padding:10px 14px;font-size:11px;line-height:1.7;pointer-events:none;z-index:9999;max-width:min(280px,90vw);display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tt .tt-title{font-weight:600;color:#fff;margin-bottom:4px}
#tt .tt-row{display:flex;gap:6px;color:var(--muted)}
#tt .tt-row span{color:var(--text)}
#tt .tt-prog{margin-top:6px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
#tt .tt-prog-fill{height:100%;border-radius:2px;background:var(--accent)}
@media(max-width:768px){
  :root{--label-w:240px;--title-w:100px}
  #tt{max-width:min(280px,90vw)}
  .chart-body,.label-body{-webkit-overflow-scrolling:touch}
}</style>
</head>

  visible.forEach((row,i)=>{
    const rowDiv=mkEl('div');
    rowDiv.style.cssText='position:absolute;left:0;right:0;top:'+i*ROW_H+'px;height:'+ROW_H+'px;border-bottom:1px solid var(--border)';
    if(row.type==='Epic')rowDiv.style.background='rgba(124,58,237,.04)';
    const s=new Date(row.start),e=new Date(row.end);
    if(s<=RE&&e>=RS){
      const x=Math.max(0,dateToX(s));
      const eNext=new Date(e);eNext.setDate(e.getDate()+1);
      const x2=Math.min(totalW,dateToX(eNext));
      const minW=scale==='day'?2:scale==='week'?3:4;
      const w=Math.max(x2-x,minW);
      const barH=row.type==='Epic'?22:row.type==='부작업'?14:18;
      const barTop=Math.floor((ROW_H-barH)/2);
      const bar=mkEl('div','bar '+statusCls(row.status));
      bar.style.cssText='left:'+x+'px;width:'+w+'px;top:'+barTop+'px;height:'+barH+'px';
      if(row.progress>0){const fill=mkEl('div','bar-fill');fill.style.width=row.progress+'%';bar.appendChild(fill);}
      if(w>50){const lbl=mkEl('div','bar-label');lbl.textContent=row.title;bar.appendChild(lbl);}
      bar.addEventListener('mouseenter',ev=>showTT(ev,row));
      bar.addEventListener('mousemove',moveTT);
      bar.addEventListener('mouseleave',hideTT);
      rowDiv.appendChild(bar);
    }
    canvas.appendChild(rowDiv);
  });
  body.appendChild(canvas);
  const labelBody=document.getElementById('labelBody');
  labelBody.innerHTML='';
  visible.forEach(row=>{
    const indent=row.type==='Epic'?0:row.type==='부작업'?2:1;
    const hasChildren=filteredData.some(r=>r.parent===row.title);
    const isCollapsed=collapsed.has(row.title);
    const prog=row.progress||0;
    const av=row.assignee||'';
    const div=mkEl('div','label-row'+(row.type==='Epic'?' epic-row':row.type==='부작업'?' sub-row':'')+(hasChildren?' clickable':''));
    div.style.height=ROW_H+'px';
    div.innerHTML='<span class="row-indent" style="width:'+indent*12+'px;flex-shrink:0"></span><span class="row-toggle">'+(hasChildren?(isCollapsed?'▶':'▼'):'')+'</span><span class="type-pip" style="background:'+typePip(row.type)+'"></span><span class="row-title" title="'+row.title+'">'+row.title+'</span><span class="row-assignee"><span class="av" style="background:'+avColor(av)+'">'+(av?av[0]:'?')+'</span><span class="av-name" title="'+av+'">'+(av||'—')+'</span></span><span class="row-prog"><span class="pn">'+(prog?Math.round(prog)+'%':'—')+'</span><span class="pb"><span class="pb-fill" style="width:'+prog+'%"></span></span></span>';
    if(hasChildren)div.addEventListener('click',()=>{collapsed.has(row.title)?collapsed.delete(row.title):collapsed.add(row.title);render();});
    labelBody.appendChild(div);
  });
  labelBody.onscroll=()=>{body.scrollTop=labelBody.scrollTop;};
  body.onscroll=()=>{labelBody.scrollTop=body.scrollTop;chartHeader.scrollLeft=body.scrollLeft;};
  chartHeader.scrollLeft=body.scrollLeft;
}
function scrollToToday(){
  const x=dateToX(TODAY);
  const panel=document.getElementById('chartBody');
  const header=document.getElementById('chartHeader');
  const pos=Math.max(0,x-panel.clientWidth/2);
  panel.scrollLeft=pos;header.scrollLeft=pos;
}
render();
setTimeout(scrollToToday,100);</script>
</body>
