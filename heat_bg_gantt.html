<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAT BG Team — Gantt Chart 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root {
  --bg:#0f1117; --surface:#181b24; --surface2:#1e2230; --border:#2a2f3e;
  --text:#e2e6f0; --muted:#7a8099; --accent:#4f8ef7;
  --s-done:#22c55e; --s-final:#16a34a; --s-wip:#f59e0b;
  --s-backlog:#64748b; --s-review:#a855f7;
  --t-epic:#a78bfa; --t-task:#93c5fd; --t-sub:#67e8f9; --t-new:#fdba74;
  --row-h:28px; --label-w:500px; --header-h:64px;
  --title-w:240px; --assignee-w:72px; --prog-w:110px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── 헤더 ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;flex-shrink:0}
header h1{font-size:15px;font-weight:700;color:#fff}
header small{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:5px;font-size:11px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{background:var(--border)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── 범례 ── */
.legend{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 20px;display:flex;gap:16px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:2px}

/* ── 간트 본체 ── */
.gantt-wrap{display:flex;flex:1;overflow:hidden;position:relative}

/* 왼쪽 라벨 패널 */
.label-panel{width:var(--label-w);flex-shrink:0;display:flex;flex-direction:column;border-right:2px solid var(--border);background:var(--surface);z-index:20}
.label-header{height:var(--header-h);border-bottom:2px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.label-body{overflow-y:auto;overflow-x:hidden;flex:1}
.label-body::-webkit-scrollbar{width:0}

.label-row{height:var(--row-h);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s;gap:4px;min-width:0}
.label-row:hover{background:var(--surface2)}
.label-row.epic-row{background:rgba(124,58,237,.08)}
.label-row.epic-row .row-title{font-weight:600;color:var(--t-epic)}
.label-row.sub-row .row-title{color:var(--t-sub)}
.row-indent{flex-shrink:0}
.row-toggle{font-size:9px;color:var(--muted);flex-shrink:0;width:12px;text-align:center;transition:.2s}
.row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:var(--title-w);flex-shrink:0;font-size:11px}
.type-pip{width:5px;height:5px;border-radius:50%;flex-shrink:0}
/* 담당자 셀 */
.row-assignee{width:var(--assignee-w);flex-shrink:0;display:flex;align-items:center;gap:4px;overflow:hidden;border-left:1px solid var(--border);padding-left:6px}
.row-assignee .av{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}
.row-assignee .av-name{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 진행률 셀 */
.row-prog{width:var(--prog-w);flex-shrink:0;display:flex;align-items:center;gap:5px;border-left:1px solid var(--border);padding-left:6px}
.row-prog .pn{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);width:28px;flex-shrink:0;text-align:right}
.row-prog .pb{flex:1;min-width:0;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;position:relative}
.row-prog .pb-fill{position:absolute;top:0;left:0;height:6px;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .3s ease}
/* 라벨 헤더 컬럼 */
.label-header{height:var(--header-h);border-bottom:2px solid var(--border);display:flex;align-items:center;padding:0 0 0 8px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;gap:4px}
.lh-title{width:var(--title-w);padding-left:29px}
.lh-assignee{width:var(--assignee-w);flex-shrink:0;border-left:1px solid var(--border);padding-left:6px}
.lh-prog{width:var(--prog-w);flex-shrink:0;border-left:1px solid var(--border);padding-left:6px}

/* 오른쪽 차트 패널 */
.chart-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chart-header{height:var(--header-h);border-bottom:2px solid var(--border);position:relative;overflow-x:scroll;overflow-y:hidden;flex-shrink:0;background:var(--surface);scrollbar-width:none}
.chart-header::-webkit-scrollbar{display:none}
.chart-body{flex:1;overflow:auto;position:relative}
.chart-body::-webkit-scrollbar{height:8px;width:8px}
.chart-body::-webkit-scrollbar-track{background:var(--surface)}
.chart-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* 시간축 */
.time-axis{position:absolute;top:0;left:0;height:100%;pointer-events:none}
.time-col-q{position:absolute;top:0;height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted);border-right:1px solid var(--border);letter-spacing:.3px;text-transform:uppercase}
.time-col-m{position:absolute;top:22px;height:34px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);border-right:1px solid rgba(255,255,255,.06)}
.time-col-m.today-m{color:var(--accent);font-weight:700}

/* 그리드 라인 */
.grid-line{position:absolute;top:0;bottom:0;pointer-events:none}
.grid-line.quarter{border-left:1px solid rgba(255,255,255,.08)}
.grid-line.month{border-left:1px solid rgba(255,255,255,.04)}
.grid-line.week{border-left:1px solid rgba(255,255,255,.04)}
.grid-line.week-month{border-left:1px solid rgba(255,255,255,.1)}
.grid-line.today{border-left:2px solid #facc15;z-index:5}
/* 오늘 라벨 (헤더에 붙는 삼각형 핀) */
.today-pin{position:absolute;top:0;width:2px;background:#facc15;z-index:6;pointer-events:none}
.today-pin::before{content:'TODAY';position:absolute;top:0;left:3px;font-size:8px;font-weight:700;color:#facc15;letter-spacing:.5px;white-space:nowrap}
/* 주 단위 시간축 */
.time-col-week-row{position:absolute;top:22px;height:42px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--muted);border-right:1px solid rgba(255,255,255,.06);white-space:nowrap}
.time-col-week-row.today-w{color:#facc15;font-weight:700}

/* 차트 행 */
.chart-row{height:var(--row-h);position:relative;border-bottom:1px solid var(--border)}
.chart-row.epic-row{background:rgba(124,58,237,.04)}
.chart-row:hover{background:rgba(255,255,255,.02)}

/* 바 */
.bar{position:absolute;top:5px;height:18px;border-radius:4px;cursor:pointer;transition:filter .15s,transform .15s;display:flex;align-items:center;overflow:hidden}
.bar:hover{filter:brightness(1.25);transform:scaleY(1.08)}
.bar-fill{height:100%;border-radius:4px;position:absolute;top:0;left:0;opacity:.35}
.bar-label{position:absolute;left:6px;right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:500;z-index:2;pointer-events:none}
.bar.epic{height:22px;top:3px;border-radius:3px}
.bar.sub{height:14px;top:7px;border-radius:2px}

/* 상태별 색상 */
.bar.done{background:#22c55e;color:#052e16}
.bar.final{background:#16a34a;color:#052e16}
.bar.wip{background:#f59e0b;color:#451a03}
.bar.backlog{background:#4a5568;color:#e2e8f0}
.bar.review{background:#7c3aed;color:#f5f3ff}

/* 툴팁 */
#tooltip{position:fixed;background:#1e2230;border:1px solid #3a4055;border-radius:8px;padding:10px 14px;font-size:11px;line-height:1.7;pointer-events:none;z-index:9999;max-width:280px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tooltip .tt-title{font-weight:600;color:#fff;margin-bottom:4px}
#tooltip .tt-row{display:flex;gap:6px;color:var(--muted)}
#tooltip .tt-row span{color:var(--text)}
#tooltip .tt-prog{margin-top:6px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
#tooltip .tt-prog-fill{height:100%;border-radius:2px;background:var(--accent)}

/* 스크롤 동기화 안내 */
.scroll-hint{position:absolute;bottom:12px;right:16px;font-size:10px;color:var(--muted);pointer-events:none}
</style>
</head>

<header>
  <div>
    <h1>🏟️ HEAT BG Team — Gantt Chart</h1>
    <small>C2U_HQ_HEAT_BACKGROUND · 2026.05.27 기준</small>
  </div>
  <div class="ctrl">
    <input type="text" id="search" placeholder="🔍 검색…" oninput="applyFilters()">
    <select id="fStatus" onchange="applyFilters()">
      <option value="">모든 상태</option>

  <span style="margin-left:8px;font-size:10px;color:var(--muted)">유형:</span>
  <div class="leg-item"><div class="leg-dot" style="background:#a78bfa"></div>Epic</div>
  <div class="leg-item"><div class="leg-dot" style="background:#93c5fd"></div>작업</div>
  <div class="leg-item"><div class="leg-dot" style="background:#67e8f9"></div>부작업</div>
</div>

<div class="gantt-wrap">

    <div class="label-header">

      <span class="lh-assignee">담당자</span>
      <span class="lh-prog">진행률</span>

  </div>
  <div class="chart-panel">
    <div class="chart-header" id="chartHeader"></div>
    <div class="chart-body" id="chartBody"></div>
  </div>
</div>

<div id="tooltip"></div>

const RAW = RAW_ALL.filter(exclude2025comp);

// ── 스케일 ──
let scale='month'; // 'week' | 'month' | 'quarter'
const COL_W_W=28;  // 주별 픽셀 너비
const COL_W_M=60;  // 월별 픽셀 너비
const COL_W_Q=200; // 분기별 픽셀 너비

// 전체 날짜 범위
const RANGE_START = new Date('2025-07-01');
const RANGE_END   = new Date('2027-07-01');
const RANGE_MS    = RANGE_END - RANGE_START;

function monthsBetween(a,b){
  return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
}

// ── 주 목록 (월요일 기준) ──
function genWeeks(){
  const weeks=[];
  // RANGE_START 이전 첫 번째 월요일부터 시작
  let d=new Date(RANGE_START);
  const dow=d.getDay(); // 0=일
  const toMon=dow===0?1:(dow===1?0:8-dow);
  d.setDate(d.getDate()-dow+(dow===0?-6:1)); // 이전 월요일
  while(d<RANGE_END){
    weeks.push(new Date(d));
    d.setDate(d.getDate()+7);
  }
  return weeks;
}

// ── 월 목록 생성 ──
function genMonths(){
  const months=[];
  let d=new Date(RANGE_START);
  while(d<RANGE_END){
    months.push(new Date(d));
    d.setMonth(d.getMonth()+1);
  }
  return months;
}

function getTotalW(){
  if(scale==='week') return genWeeks().length*COL_W_W;
  if(scale==='month') return genMonths().length*COL_W_M;
  return Math.ceil(monthsBetween(RANGE_START,RANGE_END)/3)*COL_W_Q;
}

function dateToX(d){
  const dt=typeof d==='string'?new Date(d):d;
  const ms=dt-RANGE_START;
  return (ms/RANGE_MS)*getTotalW();
}

// ── 필터된 데이터 ──
let filteredData=[...RAW];
// collapse 상태
let collapsed=new Set();

function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const fs=document.getElementById('fStatus').value;
  const fc=document.getElementById('fComp').value;
  const fa=document.getElementById('fAssignee').value;
  filteredData=RAW.filter(r=>{
    if(q&&!(r.title.toLowerCase().includes(q)||r.key.toLowerCase().includes(q)||r.assignee.toLowerCase().includes(q))) return false;
    if(fs&&r.status!==fs) return false;
    if(fc&&r.component!==fc) return false;
    if(fa&&r.assignee!==fa) return false;
    return true;
  });
  render();
}

function setScale(s){
  scale=s;
  document.getElementById('btnWeek').classList.toggle('active',s==='week');
  document.getElementById('btnMonth').classList.toggle('active',s==='month');
  document.getElementById('btnQuarter').classList.toggle('active',s==='quarter');
  render();
  setTimeout(scrollToToday,30);
}

const tooltip=document.getElementById('tooltip');
function showTT(e,row){
  const prog=row.progress||0;
  tooltip.style.display='block';
  tooltip.innerHTML=`
    <div class="tt-title">${row.title}</div>
    <div class="tt-row"><span>${row.key}</span></div>
    <div class="tt-row">상태 <span>${row.status}</span></div>
    <div class="tt-row">담당자 <span>${row.assignee||'—'}</span></div>
    <div class="tt-row">시작 <span>${row.start}</span></div>
    <div class="tt-row">종료 <span>${row.end}</span></div>
    <div class="tt-row">진행률 <span>${prog}%</span></div>
    <div class="tt-prog"><div class="tt-prog-fill" style="width:${prog}%"></div></div>`;
  moveTT(e);
}
function moveTT(e){
  const x=e.clientX+14,y=e.clientY-10;
  tooltip.style.left=Math.min(x,window.innerWidth-290)+'px';
  tooltip.style.top=Math.max(y,4)+'px';
}
function hideTT(){tooltip.style.display='none'}

// ── 렌더 ──
function render(){
  const totalW=getTotalW();
  const ROW_H=28;

  // 표시할 행 결정 (collapse 고려)
  const visibleRows=[];
  for(const row of filteredData){
    // 부모가 collapse 되어 있으면 숨김
    if(row.parent && collapsed.has(row.parent)) continue;
    if(row.parent){
      const grandParent=filteredData.find(r=>r.title===row.parent);
      if(grandParent && grandParent.parent && collapsed.has(grandParent.parent)) continue;
    }
    visibleRows.push(row);
  }

  const totalH=visibleRows.length*ROW_H;

  // ── 헤더 ──
  const header=document.getElementById('chartHeader');
  header.style.position='relative';
  header.innerHTML='';
  const axisDiv=document.createElement('div');
  axisDiv.className='time-axis';
  axisDiv.style.width=totalW+'px';
  axisDiv.style.height='100%';

  if(scale==='week'){
    const weeks=genWeeks();
    const MON2=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    // 상단: 월 구분
    let curMonth=-1, curYr=-1, mStart=0;
    weeks.forEach((w,i)=>{
      const wEnd=new Date(w); wEnd.setDate(w.getDate()+6);
      const mo=w.getMonth(), yr=w.getFullYear();
      if(mo!==curMonth||yr!==curYr){
        if(curMonth>=0){
          const el=document.createElement('div');
          el.className='time-col-q';
          el.style.left=(mStart*COL_W_W)+'px';
          el.style.width=((i-mStart)*COL_W_W)+'px';
          el.textContent=`${curYr} ${MON2[curMonth]}`;
          axisDiv.appendChild(el);
        }
        curMonth=mo; curYr=yr; mStart=i;
      }
    });
    // 마지막 월
    const el2=document.createElement('div');
    el2.className='time-col-q';
    el2.style.left=(mStart*COL_W_W)+'px';
    el2.style.width=((weeks.length-mStart)*COL_W_W)+'px';
    el2.textContent=`${curYr} ${MON2[curMonth]}`;
    axisDiv.appendChild(el2);

    // 하단: 주차 레이블 (월/일)
    weeks.forEach((w,i)=>{
      const isTodayWeek=w<=TODAY&&TODAY<new Date(w.getTime()+7*86400000);
      const el=document.createElement('div');
      el.className='time-col-week-row'+(isTodayWeek?' today-w':'');
      el.style.left=(i*COL_W_W)+'px';
      el.style.width=COL_W_W+'px';
      const d=w.getDate(), mo=w.getMonth()+1;
      el.textContent=COL_W_W>=28?`${mo}/${d}`:'';
      el.title=`${w.getFullYear()}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      axisDiv.appendChild(el);
    });

  } else if(scale==='month'){
    const months=genMonths();
    // 분기 레이블
    const quarters={};
    months.forEach((m,i)=>{
      const q=Math.floor(m.getMonth()/3);
      const yr=m.getFullYear();
      const key=`${yr}-Q${q+1}`;
      if(!quarters[key]) quarters[key]={x:i*COL_W_M,count:0,label:`${yr} Q${q+1}`};
      quarters[key].count++;
    });
    Object.values(quarters).forEach(qr=>{
      const el=document.createElement('div');
      el.className='time-col-q';
      el.style.left=qr.x+'px';
      el.style.width=(qr.count*COL_W_M)+'px';
      el.textContent=qr.label;
      axisDiv.appendChild(el);
    });
    // 월 레이블
    const MON=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    months.forEach((m,i)=>{
      const isToday=m.getFullYear()===TODAY.getFullYear()&&m.getMonth()===TODAY.getMonth();
      const el=document.createElement('div');
      el.className='time-col-m'+(isToday?' today-m':'');
      el.style.left=(i*COL_W_M)+'px';
      el.style.width=COL_W_M+'px';
      el.textContent=MON[m.getMonth()];
      axisDiv.appendChild(el);
    });
  } else {
    // 분기 스케일
    const qs=[];
    let cur=new Date(RANGE_START);
    while(cur<RANGE_END){
      qs.push(new Date(cur));
      cur.setMonth(cur.getMonth()+3);
    }
    qs.forEach((q,i)=>{
      const qn=Math.floor(q.getMonth()/3)+1;
      const el=document.createElement('div');
      el.className='time-col-q';
      el.style.left=(i*COL_W_Q)+'px';
      el.style.width=COL_W_Q+'px';
      el.style.height='100%';
      el.textContent=`${q.getFullYear()} Q${qn}`;
      axisDiv.appendChild(el);
    });
  }

  // 오늘 핀 (헤더 위)
  const todayX=dateToX(TODAY);
  const pin=document.createElement('div');
  pin.className='today-pin';
  pin.style.left=todayX+'px';
  pin.style.height='100%';
  axisDiv.appendChild(pin);

  header.appendChild(axisDiv);

  // ── 차트 본문 ──
  const body=document.getElementById('chartBody');
  body.innerHTML='';
  const canvas=document.createElement('div');
  canvas.style.cssText=`position:relative;width:${totalW}px;height:${totalH}px;`;

  // 그리드 라인
  if(scale==='week'){
    const weeks=genWeeks();
    weeks.forEach((w,i)=>{
      const isMonthStart=w.getDate()<=7;
      const gl=document.createElement('div');
      gl.className='grid-line '+(isMonthStart?'week-month':'week');
      gl.style.left=(i*COL_W_W)+'px';
      canvas.appendChild(gl);
    });
  } else if(scale==='month'){
    const months=genMonths();
    months.forEach((m,i)=>{
      const isQ=m.getMonth()%3===0;
      const gl=document.createElement('div');
      gl.className='grid-line '+(isQ?'quarter':'month');
      gl.style.left=(i*COL_W_M)+'px';
      canvas.appendChild(gl);
    });
  } else {
    const qs=[];
    let cur=new Date(RANGE_START);
    while(cur<RANGE_END){ qs.push(new Date(cur)); cur.setMonth(cur.getMonth()+3); }
    qs.forEach((q,i)=>{
      const gl=document.createElement('div');
      gl.className='grid-line quarter';
      gl.style.left=(i*COL_W_Q)+'px';
      canvas.appendChild(gl);
    });
  }
  // 오늘 라인 (노랑)
  const todayLine=document.createElement('div');
  todayLine.id='todayLine';
  todayLine.className='grid-line today';
  todayLine.style.left=todayX+'px';
  canvas.appendChild(todayLine);

  // 행 & 바
  visibleRows.forEach((row,i)=>{
    const rowDiv=document.createElement('div');
    rowDiv.className='chart-row'+(row.type==='Epic'?' epic-row':'');
    rowDiv.style.top=(i*ROW_H)+'px';
    rowDiv.style.position='absolute';
    rowDiv.style.left='0';
    rowDiv.style.right='0';
    rowDiv.style.height=ROW_H+'px';

    // 바 그리기
    const s=new Date(row.start), e=new Date(row.end);
    if(s<=RANGE_END && e>=RANGE_START){
      const x=Math.max(0,dateToX(s));
      // 종료일 다음날 0시 기준으로 너비 계산 (하루 포함)
      const eNext=new Date(e); eNext.setDate(e.getDate()+1);
      const x2=Math.min(totalW,dateToX(eNext));
      const w=Math.max(x2-x, scale==='week'?3:4);

      const bar=document.createElement('div');
      bar.className='bar '+statusCls(row.status)+(row.type==='Epic'?' epic':row.type==='부작업'?' sub':'');
      bar.style.left=x+'px';
      bar.style.width=w+'px';

      // 진행률 오버레이
      if(row.progress>0){
        const fill=document.createElement('div');
        fill.className='bar-fill';
        fill.style.width=row.progress+'%';
        fill.style.background='rgba(255,255,255,.3)';
        bar.appendChild(fill);
      }

      // 레이블 (충분한 너비일 때)
      if(w>50){
        const lbl=document.createElement('div');
        lbl.className='bar-label';
        lbl.textContent=row.title;
        bar.appendChild(lbl);
      }

      bar.addEventListener('mouseenter',e=>showTT(e,row));
      bar.addEventListener('mousemove',moveTT);
      bar.addEventListener('mouseleave',hideTT);
      rowDiv.appendChild(bar);
    }
    canvas.appendChild(rowDiv);
  });
  body.appendChild(canvas);

  // ── 라벨 패널 ──
  const labelBody=document.getElementById('labelBody');
  labelBody.innerHTML='';

  // 아바타 색상
  function avColor(name){
    if(!name) return '#4a5568';
    const colors=['#4f8ef7','#7c3aed','#f59e0b','#22c55e','#f97316','#ec4899','#06b6d4','#84cc16','#ef4444','#8b5cf6'];
    let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))&0xffff;
    return colors[h%colors.length];
  }
  // 진행률 바 색상
  function progColor(p){
    if(p>=100) return '#22c55e';
    if(p>=50) return '#4f8ef7';
    if(p>0) return '#f59e0b';
    return '#4a5568';
  }

  visibleRows.forEach((row)=>{
    const div=document.createElement('div');
    const indent=row.type==='Epic'?0:row.type==='부작업'?2:1;
    div.className='label-row'+(row.type==='Epic'?' epic-row':row.type==='부작업'?' sub-row':'');
    div.style.height=ROW_H+'px';

    const hasChildren=filteredData.some(r=>r.parent===row.title);
    const isCollapsed=collapsed.has(row.title);
    const prog=row.progress||0;
    const assignee=row.assignee||'';
    const avBg=avColor(assignee);
    const avInitial=assignee?assignee[0]:'?';
    const pColor=progColor(prog);

    div.innerHTML=`
      <span class="row-indent" style="width:${indent*12}px;flex-shrink:0"></span>
      <span class="row-toggle">${hasChildren?(isCollapsed?'▶':'▼'):''}</span>
      <span class="type-pip" style="background:${typePip(row.type)}"></span>
      <span class="row-title" title="${row.title}">${row.title}</span>
      <span class="row-assignee">
        <span class="av" style="background:${avBg}">${avInitial}</span>
        <span class="av-name" title="${assignee}">${assignee||'—'}</span>
      </span>
      <span class="row-prog">
        <span class="pn">${prog?Math.round(prog)+'%':'—'}</span>
        <span class="pb"><span class="pb-fill" style="width:${prog}%"></span></span>
      </span>
    `;
    if(hasChildren){
      div.addEventListener('click',()=>{
        if(collapsed.has(row.title)) collapsed.delete(row.title);
        else collapsed.add(row.title);
        render();
      });
    }
    labelBody.appendChild(div);
  });

  // 스크롤 동기화
  const chartHeader=document.getElementById('chartHeader');
  labelBody.onscroll=()=>{ body.scrollTop=labelBody.scrollTop; };
  body.onscroll=()=>{
    labelBody.scrollTop=body.scrollTop;
    chartHeader.scrollLeft=body.scrollLeft;
  };
  // 초기 헤더 위치 맞춤
  chartHeader.scrollLeft=body.scrollLeft;
}

function scrollToToday(){
  const x=dateToX(TODAY);
  const panel=document.getElementById('chartBody');
  const header=document.getElementById('chartHeader');
  const viewW=panel.clientWidth||800;
  const pos=Math.max(0,x-viewW/2);
  panel.scrollLeft=pos;
  header.scrollLeft=pos;
}

// 초기 렌더
render();
// 오늘로 스크롤 (약간 딜레이)
setTimeout(scrollToToday,100);
</script>
</body>
</html>
